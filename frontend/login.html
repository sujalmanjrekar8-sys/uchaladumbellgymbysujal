<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Uchala Dumbell Gym</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0b0d13; margin: 0;">

    <div class="modal-card" style="width: 100%; max-width: 400px; padding: 30px; background: #121620; border: 1px solid #283046; border-radius: 8px;">
        <div style="text-align: center; margin-bottom: 25px;">
            <h2 style="color: #f39c12; font-size: 22px;">UCHALA GYM</h2>
            <p style="color: #94a3b8; font-size: 13px;">Gym Portal Sign In</p>
        </div>

        <form id="loginForm">
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="display:block; font-size:12px; font-weight:bold; color:#94a3b8; margin-bottom:6px;">User ID</label>
                <input type="text" id="customId" placeholder="e.g. UDGOWNER-1001" required style="width:100%; padding:10px; background:#0b0d13; border:1px solid #1f2536; border-radius:6px; color:#fff; box-sizing:border-box;">
            </div>
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="display:block; font-size:12px; font-weight:bold; color:#94a3b8; margin-bottom:6px;">Password</label>
                <input type="password" id="password" placeholder="Enter password" required style="width:100%; padding:10px; background:#0b0d13; border:1px solid #1f2536; border-radius:6px; color:#fff; box-sizing:border-box;">
            </div>
            <div id="loginError" style="display:none; color:#e74c3c; font-size:13px; margin-bottom:12px;"></div>
            <button type="submit" id="loginSubmitBtn" style="width:100%; padding:12px; background:#f39c12; color:#000; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Sign In</button>
        </form>
        
        <div style="text-align: center; margin-top: 15px;">
            <a href="index.html" style="color: #94a3b8; font-size: 12px; text-decoration: none;">&larr; Back to Home</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
